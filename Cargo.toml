# Minecraft on its own: the game, its terrain crate and the MinecraftOSS
# engine crates, in one workspace.
[workspace]
resolver = "3"
members = [
    "minecraft",
    "crates/minecraft_terrain",
    "third_party/minecraftoss/core",
    "third_party/minecraftoss/entities",
    "third_party/minecraftoss/generator",
    "third_party/minecraftoss/player",
    "third_party/minecraftoss/world",
]
default-members = ["minecraft"]

# Line numbers in crash reports' backtraces (on Windows, from minecraft.pdb
# next to the program).
[profile.release]
debug = "line-tables-only"
